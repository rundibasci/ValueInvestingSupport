market-data:
  source: fmp

spring:
  cache:
    type: simple
  datasource:
    url: jdbc:h2:mem:vis;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false  # H2 cannot execute PostgreSQL-specific SQL in V2 migration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

app:
  observability:
    request-logging-enabled: false
  jobs:
    enabled: true
    exchanges:
      - NYSE
    cron:
      bulk-profile:      "-"
      bulk-fundamentals: "-"
      bulk-ratios:       "-"
      bulk-dcf:          "-"
      quote-refresh:     "-"
      dividend-update:   "-"
      insider-trading:   "-"
