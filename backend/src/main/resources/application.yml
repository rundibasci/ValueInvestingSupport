spring:
  application:
    name: vis-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}
  flyway:
    enabled: false
  jpa:
    open-in-view: false

market-data:
  source: ${MARKET_DATA_SOURCE:fmp}

app:
  observability:
    request-logging-enabled: ${REQUEST_LOGGING_ENABLED:true}
    correlation-header: ${CORRELATION_HEADER:X-Correlation-ID}
  cache:
    ttl:
      quote: 15m
      ratios: 6h
      fundamentals: 6h
      profile: 24h
  jobs:
    enabled: true
    exchanges:
      - NYSE
      - NASDAQ
    cron:
      bulk-profile:      "0 0 2 * * *"
      bulk-fundamentals: "0 0 3 * * *"
      bulk-ratios:       "0 30 3 * * *"
      bulk-dcf:          "0 0 4 * * *"
      quote-refresh:     "0 */15 * * * *"
      dividend-update:   "0 0 6 * * *"
      insider-trading:   "0 0 * * * *"
      alert-detection:   "0 20 0 * * *"
  seed-runs:
    async-threshold: ${SEED_ASYNC_THRESHOLD:10}
    max-symbols: ${SEED_MAX_SYMBOLS:500}
    worker-concurrency: ${SEED_WORKER_CONCURRENCY:2}
    queue-capacity: ${SEED_QUEUE_CAPACITY:20}
    retention-days: ${SEED_RUN_RETENTION_DAYS:30}
    polling-interval-ms: ${SEED_POLLING_INTERVAL_MS:1500}
  portfolio-import:
    max-upload-bytes: ${PORTFOLIO_IMPORT_MAX_BYTES:1048576}
    max-rows: ${PORTFOLIO_IMPORT_MAX_ROWS:1000}
    preview-retention-hours: ${PORTFOLIO_IMPORT_RETENTION_HOURS:24}
    default-base-currency: ${PORTFOLIO_IMPORT_BASE_CURRENCY:EUR}
    cleanup-cron: ${PORTFOLIO_IMPORT_CLEANUP_CRON:0 15 1 * * *}
  alert-email:
    enabled: ${ALERT_EMAIL_ENABLED:false}
    from: ${ALERT_EMAIL_FROM:}
    max-attempts: ${ALERT_EMAIL_MAX_ATTEMPTS:3}

jwt:
  access-token-expiry-seconds: 900
  refresh-token-expiry-seconds: 604800

google:
  oauth2:
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
    frontend-callback: ${GOOGLE_FRONTEND_CALLBACK:http://localhost:5173/auth/oauth2/callback}

valuation:
  weights:
    dcf: 0.60
    graham: 0.25
    ddm: 0.15
  defaults:
    wacc: 0.09
    growth-y1-y5: 0.08
    growth-y6-y10: 0.04
    terminal-rate: 0.025
  enhancements:
    risk-free-rate: 0.045
    equity-risk-premium: 0.055
    sector-fallback-wacc: 0.09
    maintenance-capex-depreciation-ratio: 0.70
    high-terminal-dependence-threshold: 70.00
    reduced-dcf-weight: 0.40

scoring:
  risk:
    weight-profiles:
      dividend-paying:
        mos: 30
        quality: 25
        safety: 20
        growth: 15
        dividend: 10
      non-dividend-growth:
        mos: 30
        quality: 30
        safety: 20
        growth: 20
        dividend: 0
      reit-utility:
        mos: 30
        quality: 20
        safety: 30
        growth: 10
        dividend: 10
      financial:
        mos: 30
        quality: 25
        safety: 25
        growth: 10
        dividend: 10
      cyclical:
        mos: 30
        quality: 20
        safety: 25
        growth: 15
        dividend: 10

management:
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  observations:
    annotations:
      enabled: true
  endpoint:
    health:
      status:
        order: down,out-of-service,degraded,unknown,up
  metrics:
    tags:
      application: ${spring.application.name}
