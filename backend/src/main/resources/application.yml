spring:
  application:
    name: vis-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}
  flyway:
    enabled: false
  jpa:
    open-in-view: false

market-data:
  source: yahoo

app:
  observability:
    request-logging-enabled: ${REQUEST_LOGGING_ENABLED:true}
    correlation-header: ${CORRELATION_HEADER:X-Correlation-ID}
  cache:
    ttl:
      quote: 15m
      ratios: 6h
      fundamentals: 6h
      profile: 24h
  jobs:
    enabled: true
    exchanges:
      - NYSE
      - NASDAQ
    cron:
      bulk-profile:      "0 0 2 * * *"
      bulk-fundamentals: "0 0 3 * * *"
      bulk-ratios:       "0 30 3 * * *"
      bulk-dcf:          "0 0 4 * * *"
      quote-refresh:     "0 */15 * * * *"
      dividend-update:   "0 0 6 * * *"
      insider-trading:   "0 0 * * * *"
      alert-detection:   "0 20 0 * * *"
  alert-email:
    enabled: ${ALERT_EMAIL_ENABLED:false}
    from: ${ALERT_EMAIL_FROM:}
    max-attempts: ${ALERT_EMAIL_MAX_ATTEMPTS:3}

jwt:
  access-token-expiry-seconds: 900
  refresh-token-expiry-seconds: 604800

google:
  oauth2:
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
    frontend-callback: ${GOOGLE_FRONTEND_CALLBACK:http://localhost:5173/auth/oauth2/callback}

valuation:
  weights:
    dcf: 0.60
    graham: 0.25
    ddm: 0.15
  defaults:
    wacc: 0.09
    growth-y1-y5: 0.08
    growth-y6-y10: 0.04
    terminal-rate: 0.025

management:
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  observations:
    annotations:
      enabled: true
  endpoint:
    health:
      status:
        order: down,out-of-service,degraded,unknown,up
  metrics:
    tags:
      application: ${spring.application.name}
