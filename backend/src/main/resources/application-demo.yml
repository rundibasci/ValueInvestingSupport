market-data:
  source: ${MARKET_DATA_SOURCE:fmp}

spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=900s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080

logging:
  level:
    it.mazzoni.vis: DEBUG
