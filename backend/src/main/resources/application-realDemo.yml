market-data:
  source: ${MARKET_DATA_SOURCE:fmp}

real-demo:
  tickers: ${REAL_DEMO_TICKERS:AAPL,MSFT,KO,JNJ,PG,PEP,WMT,BRK-B,UNP,XOM}

app:
  jobs:
    enabled: false

spring:
  cache:
    type: redis
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vis}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:vis}
    password: ${DATABASE_PASSWORD:vis}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

