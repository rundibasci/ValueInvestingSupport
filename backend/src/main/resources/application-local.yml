spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vis
    username: ${DATABASE_USERNAME:vis}
    password: ${DATABASE_PASSWORD:vis}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
