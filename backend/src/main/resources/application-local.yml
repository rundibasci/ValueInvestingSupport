market-data:
  source: ${MARKET_DATA_SOURCE:fmp}

fmp:
  api-key: ${FMP_API_KEY:}

spring:
  cache:
    type: redis
  datasource:
    url: jdbc:postgresql://localhost:5432/vis
    username: ${DATABASE_USERNAME:vis}
    password: ${DATABASE_PASSWORD:vis}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
