[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vis-model-training"
version = "0.2.0"
description = "Dataset contracts and validation tools for the VIS Investment Thesis Agent"
requires-python = ">=3.9"
dependencies = [
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["vis_training*", "scripts*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
