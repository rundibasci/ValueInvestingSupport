name: K2 Rollback

# Redeploys a previously known-good immutable image digest to the chosen
# environment, without a source rebuild. Use for the restore/rollback drill
# in plan.md Group 9, or a real incident.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to roll back"
        required: true
        type: choice
        options: [dev, staging]
      image:
        description: "Previous known-good full image reference (with digest)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.K2_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.K2_DEPLOYER_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: terraform init
        working-directory: terraform/environments/${{ inputs.environment }}
        run: terraform init

      - name: terraform apply (redeploy previous digest)
        working-directory: terraform/environments/${{ inputs.environment }}
        run: |
          terraform apply -auto-approve \
            -var="image=${{ inputs.image }}" \
            -var="workload_identity_pool_name=${{ vars.K2_WORKLOAD_IDENTITY_POOL_NAME }}"

      - name: Resolve deployed URL
        id: deployed
        working-directory: terraform/environments/${{ inputs.environment }}
        run: echo "url=$(terraform output -raw cloud_run_url)" >> "$GITHUB_OUTPUT"

      - name: Health smoke check
        run: |
          curl -sSf "${{ steps.deployed.outputs.url }}/actuator/health/liveness" \
            -H "Authorization: Bearer $(gcloud auth print-identity-token)"
